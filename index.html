{% capture original %}{% include_relative index-source.html %}{% endcapture %}
{% capture collaboration_patch %}
<script>
(() => {
  const collaboration = document.getElementById('collaboration');
  const teaching = document.getElementById('teaching');
  if (collaboration && teaching) {
    const heading = collaboration.querySelector('h2');
    if (heading) heading.textContent = 'Collaboration & contact';
    teaching.insertAdjacentElement('afterend', collaboration);
  }

  const nav = document.getElementById('sidenav');
  const collaborationLink = nav?.querySelector('a[href="#collaboration"]');
  const teachingLink = nav?.querySelector('a[href="#teaching"]');
  if (collaborationLink && teachingLink) {
    teachingLink.insertAdjacentElement('afterend', collaborationLink);
  }
})();
</script>
</body>
{% endcapture %}
{{ original | replace: '</body>', collaboration_patch }}
