name: Rebuild Impact section once

on:
  push:

permissions:
  contents: write

jobs:
  update-impact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace Impact section only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          payload = ''
          new = base64.b64decode(payload).decode('utf-8')

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          start_marker = '<section id="impact">'
          end_marker = '<section id="collaboration">'
          assert text.count(start_marker) == 1
          assert text.count(end_marker) == 1
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old = text[start:end]
          assert 'Australian drug-diversion policy (2026)' in old
          updated = text[:start] + new + text[end:]
          assert updated[:start] == text[:start]
          assert updated.endswith(text[end:])
          p.write_text(updated, encoding='utf-8')
          PY

      - name: Commit Impact section
        shell: bash
        run: |
          test "$(git diff --name-only)" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Expand and restyle Selected Impact"
          git push origin HEAD:main
