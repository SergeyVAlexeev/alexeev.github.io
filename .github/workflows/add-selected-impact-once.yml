name: Add Selected Impact once

on:
  push:
    paths:
      - '.github/workflows/add-selected-impact-once.yml'

permissions:
  contents: write

jobs:
  update-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add Selected Impact section only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          assert '<section id="impact">' not in text
          assert '<a href="#impact">Impact <span>↵</span></a>' not in text

          nav_old = '''    <a href="#publications">Publications <span>↵</span></a>\n    <a href="#collaboration">Collaboration <span>↵</span></a>'''
          nav_new = '''    <a href="#publications">Publications <span>↵</span></a>\n    <a href="#impact">Impact <span>↵</span></a>\n    <a href="#collaboration">Collaboration <span>↵</span></a>'''
          assert text.count(nav_old) == 1
          text = text.replace(nav_old, nav_new, 1)

          marker = '<section id="collaboration">'
          assert text.count(marker) == 1

          impact = '''<section id="impact">\n  <h2>Selected impact</h2>\n\n  <p>\n    <strong>Drug-diversion policy, Queensland Parliament (2026).</strong> My causal study of fines for illicit-drug offences was cited in three submissions to a Queensland parliamentary committee considering drug-diversion policy, where sector organisations used it to support health-oriented alternatives to fines.\n  </p>\n\n  <p class="pub-links">\n    <a href="https://doi.org/10.1016/j.jebo.2022.06.015" target="_blank" rel="noopener">Paper</a>\n    · <a href="https://documents.parliament.qld.gov.au/com/JICSC-CD82/EACATTSSDA-7004/submissions/00000103.pdf" target="_blank" rel="noopener">QNADA submission</a>\n    · <a href="https://documents.parliament.qld.gov.au/com/JICSC-CD82/EACATTSSDA-7004/submissions/00000120.pdf" target="_blank" rel="noopener">QuIHN submission</a>\n    · <a href="https://documents.parliament.qld.gov.au/com/JICSC-CD82/EACATTSSDA-7004/submissions/00000145.pdf" target="_blank" rel="noopener">QAIHC submission</a>\n  </p>\n</section>\n\n\n'''

          updated = text.replace(marker, impact + marker, 1)

          assert updated.count('<section id="impact">') == 1
          assert updated.count('<a href="#impact">Impact <span>↵</span></a>') == 1
          assert updated.index('<section id="publications">') < updated.index('<section id="impact">') < updated.index('<section id="collaboration">')
          assert updated.count('<section id="publications">') == text.count('<section id="publications">')
          assert updated.count('<section id="collaboration">') == text.count('<section id="collaboration">')

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit homepage change
        shell: bash
        run: |
          test "$(git diff --name-only)" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Selected Impact section"
          git push origin HEAD:main
