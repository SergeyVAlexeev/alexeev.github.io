name: Apply Collaboration contact move once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-collaboration-contact-once.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch static homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old_nav = '    <a href="#grants">Grants <span>↵</span></a>\n    <a href="#collaboration">Collaboration <span>↵</span></a>\n    <a href="#consulting">Consulting <span>↵</span></a>\n    <a href="#teaching">Teaching <span>↵</span></a>'
          new_nav = '    <a href="#grants">Grants <span>↵</span></a>\n    <a href="#consulting">Consulting <span>↵</span></a>\n    <a href="#teaching">Teaching <span>↵</span></a>\n    <a href="#collaboration">Collaboration <span>↵</span></a>'
          assert text.count(old_nav) == 1, 'nav marker mismatch'
          text = text.replace(old_nav, new_nav, 1)
          marker = '\n<section id="collaboration">'
          assert text.count(marker) == 1, 'collaboration marker mismatch'
          collab_start = text.index(marker)
          collab_close = text.index('\n</section>', collab_start) + len('\n</section>')
          collab = text[collab_start:collab_close]
          assert collab.count('<h2>Collaboration</h2>') == 1, 'collaboration heading mismatch'
          collab = collab.replace('<h2>Collaboration</h2>', '<h2>Collaboration &amp; contact</h2>', 1)
          text = text[:collab_start] + text[collab_close:]
          teaching_marker = '\n<section id="teaching">'
          assert text.count(teaching_marker) == 1, 'teaching marker mismatch'
          teaching_start = text.index(teaching_marker)
          teaching_close = text.index('\n</section>', teaching_start) + len('\n</section>')
          text = text[:teaching_close] + '\n\n' + collab + text[teaching_close:]
          assert text.count('<section id="collaboration">') == 1
          assert text.count('<h2>Collaboration &amp; contact</h2>') == 1
          assert text.index('<section id="grants">') < text.index('<section id="consulting">') < text.index('<section id="teaching">') < text.index('<section id="collaboration">')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage change and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-collaboration-contact-once.yml
          git add index.html
          git diff --cached --check
          git commit -m "Move Collaboration to contact position"
          git push origin HEAD:main
