name: Update expert consulting section once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-expert-consulting-once.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace consulting section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          start_marker = '<section id="consulting">'
          end_marker = '</section>'
          assert text.count(start_marker) == 1, 'consulting marker mismatch'
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          new = '''<section id="consulting">
  <h2>Expert &amp; consulting work</h2>

  <ul class="publist">
    <li>
      <span class="pub-title">Fair Work Commission</span>
      <div class="pub-meta">Expert economic and statistical evidence in an award-variation proceeding.</div>
      <div class="pub-links">Instructed by Piper Alderman and Citation Legal.</div>
    </li>

    <li>
      <span class="pub-title">NSW Industrial Relations Commission</span>
      <div class="pub-meta">Expert economic evidence in the Visiting Medical Officers arbitration.</div>
      <div class="pub-links">Instructed by HWLE Lawyers.</div>
    </li>
  </ul>
</section>'''
          text = text[:start] + new + text[end:]
          assert text.count('<h2>Expert &amp; consulting work</h2>') == 1
          assert 'My background spans corporate finance' not in text
          assert 'Instructed by Piper Alderman and Citation Legal.' in text
          assert 'Instructed by HWLE Lawyers.' in text
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage change and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-expert-consulting-once.yml
          git add index.html
          git diff --cached --check
          git commit -m "Tighten expert and consulting work"
          git push origin HEAD:main
