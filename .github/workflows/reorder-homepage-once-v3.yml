name: Reorder homepage once v3

on:
  push:
    paths:
      - '.github/workflows/reorder-homepage-once-v3.yml'

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Reorder visible sections and navigation only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          collab_nav = '    <a href="#collaboration">Collaboration <span>↵</span></a>'
          pubs_nav = '    <a href="#publications">Publications <span>↵</span></a>'
          assert text.count(collab_nav) == 1
          assert text.count(pubs_nav) == 1
          assert text.index(collab_nav) < text.index(pubs_nav)
          text = text.replace(collab_nav + '\n' + pubs_nav, pubs_nav + '\n' + collab_nav, 1)

          collab = text.index('<section id="collaboration">')
          pubs = text.rindex('<section id="publications">')
          consulting = text.index('<section id="consulting">', pubs)
          assert collab < pubs < consulting

          pubs_block = text[pubs:consulting]
          pubs_hash = hashlib.sha256(pubs_block.encode('utf-8')).hexdigest()
          assert '<h2>Publications</h2>' in pubs_block
          assert 'Journal articles &amp; related media coverage' in pubs_block

          base = text[:pubs] + text[consulting:]
          insert_at = base.index('<section id="collaboration">')
          updated = base[:insert_at] + pubs_block + base[insert_at:]

          about_pos = updated.index('<section id="about">')
          pubs_pos = updated.rindex('<section id="publications">')
          collab_pos = updated.index('<section id="collaboration">')
          consulting_pos = updated.index('<section id="consulting">')
          assert about_pos < pubs_pos < collab_pos < consulting_pos

          moved_block = updated[pubs_pos:collab_pos]
          assert hashlib.sha256(moved_block.encode('utf-8')).hexdigest() == pubs_hash
          assert updated.count('<section id="publications">') == text.count('<section id="publications">')
          assert updated.count('<section id="collaboration">') == text.count('<section id="collaboration">')

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit only index.html
        shell: bash
        run: |
          test "$(git diff --name-only)" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move Publications before Collaboration"
          git push origin HEAD:main
