name: Reorder research grants once

on:
  push:

permissions:
  contents: write

jobs:
  update-homepage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Move and rename Grants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          grants_marker = '<section id="grants">\n  <h2>Proposed Grants</h2>'
          assert grants_marker in text
          gs = text.index(grants_marker)
          ge = text.index('</section>', gs) + len('</section>')
          grants = text[gs:ge]
          grants = grants.replace(
              '<h2>Proposed Grants</h2>',
              '<h2>Research program &amp; grants</h2>',
              1,
          )

          text = text[:gs] + text[ge:]

          ims = text.index('<section id="impact">')
          ime = text.index('</section>', ims) + len('</section>')
          text = text[:ime] + '\n\n\n' + grants + text[ime:]

          old_nav = '''    <a href="#impact">Impact <span>↵</span></a>
    <a href="#collaboration">Collaboration <span>↵</span></a>
    <a href="#consulting">Consulting <span>↵</span></a>
    <a href="#grants">Grants <span>↵</span></a>'''
          new_nav = '''    <a href="#impact">Impact <span>↵</span></a>
    <a href="#grants">Grants <span>↵</span></a>
    <a href="#collaboration">Collaboration <span>↵</span></a>
    <a href="#consulting">Consulting <span>↵</span></a>'''
          assert old_nav in text
          text = text.replace(old_nav, new_nav, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage change
        shell: bash
        run: |
          test "$(git diff --name-only)" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move research grants after impact"
          git push origin HEAD:main
