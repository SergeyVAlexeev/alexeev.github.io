name: Update grants content once

on:
  pull_request_target:
    types: [reopened]

permissions:
  contents: write

jobs:
  update-homepage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Shorten heading and add AHURI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old_heading = '<h2>Research program &amp; grants</h2>'
          new_heading = '<h2>Research &amp; grants</h2>'
          assert text.count(old_heading) == 1
          text = text.replace(old_heading, new_heading, 1)

          gs = text.index('<section id="grants">')
          ge = text.index('</section>', gs) + len('</section>')
          grants = text[gs:ge]
          assert 'AHURI: Community-led pathways to safe and appropriate housing in small remote First Nations communities' not in grants

          revalue = 'REVALUE-AU: Revaluing Work and Evaluating Labour-market Adjustment in Australia'
          rs = grants.index(revalue)
          first_li_end = grants.index('</li>', rs) + len('</li>')

          ahuri = '''

    <li>
      <span class="pub-title" tabindex="0" role="button">
        AHURI: Community-led pathways to safe and appropriate housing in small remote First Nations communities
        <span class="abs">
          Working with small and remote First Nations communities, this project will identify community-prioritised pathways to safe, appropriate, energy-efficient, thermally resilient and maintainable housing that can inform national housing reform.
        </span>
      </span>
      <div class="pub-meta">AHURI First Nations Research Project</div>
    </li>'''

          grants = grants[:first_li_end] + ahuri + grants[first_li_end:]
          text = text[:gs] + grants + text[ge:]

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage change and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reorder-research-grants-once.yml
          git add index.html
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/reorder-research-grants-once.yml\nindex.html'
          git commit -m "Tighten grants heading and add AHURI project"
          git push origin HEAD:main
