name: Apply ACCELERATE DOI link

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-accelerate-doi.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace fragile ScienceDirect link with DOI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = "https://www.sciencedirect.com/science/article/pii/S002074892600324X"
          new = "https://doi.org/10.1016/j.ijnurstu.2026.105652"

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one ACCELERATE link, found {count}")

          path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/apply-accelerate-doi.yml").unlink()
          PY

      - name: Commit targeted replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-accelerate-doi.yml
          git diff --cached --check
          git commit -m "Use DOI for ACCELERATE trial link"
          git push
