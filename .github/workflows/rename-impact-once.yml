name: Rename impact once

on:
  push:
    paths:
      - '.github/workflows/rename-impact-once.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rename impact title only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<strong>Drug-diversion policy, Queensland Parliament (2026).</strong>'
          new = '<strong>Australian drug-diversion policy (2026).</strong>'
          assert text.count(old) == 1
          updated = text.replace(old, new, 1)
          assert updated.count(new) == 1
          p.write_text(updated, encoding='utf-8')
          PY

      - name: Commit
        shell: bash
        run: |
          test "$(git diff --name-only)" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Broaden drug-diversion impact label"
          git push origin HEAD:main
