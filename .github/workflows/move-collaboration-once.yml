name: Move collaboration to contact position once

on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Move and rename Collaboration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old_nav = '''    <a href="#grants">Grants <span>↵</span></a>
    <a href="#collaboration">Collaboration <span>↵</span></a>
    <a href="#consulting">Consulting <span>↵</span></a>
    <a href="#teaching">Teaching <span>↵</span></a>'''
          new_nav = '''    <a href="#grants">Grants <span>↵</span></a>
    <a href="#consulting">Consulting <span>↵</span></a>
    <a href="#teaching">Teaching <span>↵</span></a>
    <a href="#collaboration">Collaboration <span>↵</span></a>'''
          assert text.count(old_nav) == 1
          text = text.replace(old_nav, new_nav, 1)

          collab_start = text.index('\n<section id="collaboration">')
          collab_close = text.index('\n</section>', collab_start) + len('\n</section>')
          collab = text[collab_start:collab_close]
          assert collab.count('<h2>Collaboration</h2>') == 1
          collab = collab.replace('<h2>Collaboration</h2>', '<h2>Collaboration &amp; contact</h2>', 1)
          text = text[:collab_start] + text[collab_close:]

          teaching_start = text.index('\n<section id="teaching">')
          teaching_close = text.index('\n</section>', teaching_start) + len('\n</section>')
          text = text[:teaching_close] + '\n\n' + collab + text[teaching_close:]

          assert text.count('<section id="collaboration">') == 1
          assert text.count('<h2>Collaboration &amp; contact</h2>') == 1
          assert text.index('<section id="grants">') < text.index('<section id="consulting">') < text.index('<section id="teaching">') < text.index('<section id="collaboration">')

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage change and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/move-collaboration-once.yml
          git add index.html
          git commit -m "Move Collaboration to contact position"
          git push origin HEAD:main
