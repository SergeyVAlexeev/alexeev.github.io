name: Verify link maintenance once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-links-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm updated homepage is deployed
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl -fsSL "https://www.alexeev.pw/" | grep -Fq "https://doi.org/10.1016/j.ijnurstu.2026.105652"; then
              exit 0
            fi
            sleep 5
          done
          echo "Updated homepage did not appear during verification window" >&2
          exit 1

      - name: Check all public website links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >
            --verbose
            --no-progress
            --method get
            --max-retries 3
            --max-concurrency 4
            --accept "100..=103,200..=299,403,405,429,999"
            --exclude "^https://www[.]sciencedirect[.]com/journal/international-journal-of-drug-policy/about/editorial-board/?$"
            "https://www.alexeev.pw/"
            "https://www.alexeev.pw/hope/"
            "https://www.alexeev.pw/family/"
            "https://www.alexeev.pw/revalue-au/"
            "https://www.alexeev.pw/mailbridge/privacy.html"
