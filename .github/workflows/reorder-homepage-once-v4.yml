name: Reorder homepage once v4

on:
  push:
    paths:
      - '.github/workflows/reorder-homepage-once-v4.yml'

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Reorder homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '    <a href="#collaboration">Collaboration <span>↵</span></a>\n    <a href="#publications">Publications <span>↵</span></a>',
              '    <a href="#publications">Publications <span>↵</span></a>\n    <a href="#collaboration">Collaboration <span>↵</span></a>',
              1,
          )
          ps = s.rfind('\n<section id="publications">')
          cs = s.find('\n<section id="consulting">', ps)
          block = s[ps:cs]
          s = s[:ps] + s[cs:]
          ins = s.find('\n<section id="collaboration">')
          s = s[:ins] + block + '\n' + s[ins:]
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move Publications before Collaboration"
          git push origin HEAD:main
