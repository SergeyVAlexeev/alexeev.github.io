name: Update About copy and portrait once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-homepage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update About copy and portrait size
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old_pic = '.about-pic{width:240px; height:auto; border-radius:6px; flex-shrink:0; margin-top:0; order:1;}'
          new_pic = '.about-pic{width:300px; height:auto; border-radius:6px; flex-shrink:0; margin-top:0; order:1;}'
          assert text.count(old_pic) == 1
          text = text.replace(old_pic, new_pic, 1)

          old_copy = '''I am currently a Senior Research Associate at UNSW’s Nura Gili Centre for Indigenous Programs and an Adjunct Senior Lecturer at the University of Sydney’s NHMRC Clinical Trials Centre. I am also an Associate Editor of the <a href="https://link.springer.com/journal/13033" target="_blank" rel="noopener"><i>International Journal of Mental Health Systems</i></a>, serve on the Editorial Board of the <a href="https://www.sciencedirect.com/journal/international-journal-of-drug-policy/about/editorial-board" target="_blank" rel="noopener"><i>International Journal of Drug Policy</i></a>, and contribute to the <a href="https://onlinelibrary.wiley.com/toc/14657295/2026/64/1" target="_blank" rel="noopener">Institute for Replication (I4R)</a>.'''
          new_copy = '''I am a Senior Research Associate at UNSW’s Nura Gili Centre for Indigenous Programs and an Adjunct Senior Lecturer at the University of Sydney’s NHMRC Clinical Trials Centre. I serve as an Associate Editor of the <a href="https://link.springer.com/journal/13033" target="_blank" rel="noopener"><i>International Journal of Mental Health Systems</i></a> and as a member of the Editorial Board of the <a href="https://www.sciencedirect.com/journal/international-journal-of-drug-policy/about/editorial-board" target="_blank" rel="noopener"><i>International Journal of Drug Policy</i></a>, and contribute to the <a href="https://onlinelibrary.wiley.com/toc/14657295/2026/64/1" target="_blank" rel="noopener">Institute for Replication (I4R)</a>.'''
          assert text.count(old_copy) == 1
          text = text.replace(old_copy, new_copy, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage change and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/about-copy-photo-once.yml
          if [ -f .github/about-copy-photo-trigger.txt ]; then git rm .github/about-copy-photo-trigger.txt; fi
          test "$(git diff --name-only | tr '\n' ' ')" = ".github/workflows/about-copy-photo-once.yml index.html " || true
          git add index.html
          git commit -m "Polish About opening and enlarge portrait"
          git push origin HEAD:main
