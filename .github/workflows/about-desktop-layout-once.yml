name: Fix About desktop layout once

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  update-homepage:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Tighten desktop About layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          marker = '''/* About handles: no horizontal rule */
.about-handles{margin-top:14px; padding-top:0; border-top:none;}



@media (max-width:640px){'''
          replacement = '''/* About handles: no horizontal rule */
.about-handles{margin-top:14px; padding-top:0; border-top:none;}

/* Desktop About: keep profile links with the text instead of below the portrait */
@media (min-width:641px){
  section#about{
    display:grid;
    grid-template-columns:minmax(0, 1fr) 200px;
    column-gap:28px;
    align-items:start;
  }
  section#about > h2{grid-column:1 / -1;}
  section#about .about-row{display:contents;}
  section#about .about-text{grid-column:1; grid-row:2;}
  section#about .about-pic{
    grid-column:2;
    grid-row:2 / span 2;
    width:200px;
    margin-top:0;
  }
  section#about .about-handles{
    grid-column:1;
    grid-row:3;
    margin-top:12px;
  }
}

@media (max-width:640px){'''

          assert text.count(marker) == 1
          text = text.replace(marker, replacement, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage change
        shell: bash
        run: |
          test "$(git diff --name-only)" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Tighten About desktop layout"
          git push origin HEAD:main
