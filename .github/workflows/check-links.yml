name: One-shot rejoinder link update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-links.yml'

permissions:
  contents: write

jobs:
  patch-rejoinder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add rejoinder and reply tooltip
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          title = 'Risky alcohol use and violence against women: cause or consequence?'
          if s.count(title) < 1:
              raise SystemExit('Target publication not found')
          pos = s.index(title)
          b0 = s.rfind('<li>', 0, pos)
          b1 = s.index('</li>', pos) + len('</li>')
          block = s[b0:b1]
          if 'S0955395926001854' in block:
              raise SystemExit(0)
          anchor = '\n        · <a href="https://app.dimensions.ai/details/publication/pub.1192827829" target="_blank" rel="noopener">Dimensions</a>'
          if block.count(anchor) != 1:
              raise SystemExit('Dimensions anchor not unique in target publication')
          addition = '\n        · <a href="https://linkinghub.elsevier.com/retrieve/pii/S0955395926001854" target="_blank" rel="noopener">Rejoinder</a><span class="inline-tip"><span class="info" tabindex="0" role="button" aria-label="Note about rejoinder">ⓘ<span class="tip" role="note">Our rejoinder responds to <a href="https://linkinghub.elsevier.com/retrieve/pii/S0955395925003731" target="_blank" rel="noopener">Cook et al.&rsquo;s reply</a>.</span></span></span>'
          block = block.replace(anchor, addition + anchor, 1)
          out = s[:b0] + block + s[b1:]
          if out.count('S0955395926001854') != 1 or out.count('S0955395925003731') != 1:
              raise SystemExit('Rejoinder/reply validation failed')
          p.write_text(out, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add rejoinder and reply tooltip"
          git push
