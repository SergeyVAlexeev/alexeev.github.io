name: One-shot handle label cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-handles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten paired handle labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old1 = base64.b64decode('PGEgaHJlZj0iaHR0cHM6Ly9yZXNlYXJjaC51bnN3LmVkdS5hdS9wZW9wbGUvZHItc2VyZ2V5LWFsZXhlZXYiIHRhcmdldD0iX2JsYW5rIiByZWw9Im5vb3BlbmVyIj5VTlNXPC9hPiBwcm9maWxlcw==').decode('utf-8')
          new1 = base64.b64decode('PGEgaHJlZj0iaHR0cHM6Ly9yZXNlYXJjaC51bnN3LmVkdS5hdS9wZW9wbGUvZHItc2VyZ2V5LWFsZXhlZXYiIHRhcmdldD0iX2JsYW5rIiByZWw9Im5vb3BlbmVyIj5VTlNXIHByb2ZpbGVzPC9hPg==').decode('utf-8')

          teaching_href = 'https://www.dropbox.com/scl/fi/5bkrxyy1seo1x433b6ynr/Teaching-Statement-online.pdf?rlkey=86skii0gcp67amy76mrqeca1x&dl=0'
          pattern = re.compile(r'(>Research</a>)\s*/\s*(<a href="' + re.escape(teaching_href) + r'")')

          if new1 not in s:
              if s.count(old1) != 1:
                  raise SystemExit(f'Expected one UNSW profile suffix target, found {s.count(old1)}')
              s = s.replace(old1, new1, 1)

          s, n = pattern.subn(r'\1/\2', s, count=1)
          if n != 1 and 'Research</a>/<a href="' + teaching_href + '"' not in s:
              raise SystemExit(f'Expected one Research/Teaching slash target, found {n}')

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Tighten profile and statement labels"
          git push
