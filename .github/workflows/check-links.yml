name: One-shot profile link refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-profile-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add USyd and UNSW profile links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = base64.b64decode('PGEgaHJlZj0iaHR0cHM6Ly9yZXNlYXJjaC51bnN3LmVkdS5hdS9wZW9wbGUvZHItc2VyZ2V5LWFsZXhlZXYiIHRhcmdldD0iX2JsYW5rIiByZWw9Im5vb3BlbmVyIj5VTlNXIHByb2ZpbGU8L2E+').decode('utf-8')
          new = base64.b64decode('').decode('utf-8')

          if new in s:
              raise SystemExit(0)
          if s.count(old) != 1:
              raise SystemExit(f'Expected one active UNSW profile link, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add USyd and UNSW profile links"
          git push
