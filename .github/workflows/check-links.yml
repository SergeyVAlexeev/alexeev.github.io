name: One-shot publication topic reorder

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reorder-publications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder recent publications within year
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          heading = '<h3>Journal articles &amp; related media coverage</h3>'
          h = s.find(heading)
          if h < 0:
              raise SystemExit('Journal articles heading not found')
          ul_start = s.find('<ul class="publist">', h)
          if ul_start < 0:
              raise SystemExit('Journal articles list not found')
          body_start = ul_start + len('<ul class="publist">')
          body_end = s.find('</ul>', body_start)
          if body_end < 0:
              raise SystemExit('Journal articles list end not found')

          body = s[body_start:body_end]
          masked = re.sub(r'<!--.*?-->', lambda m: ' ' * len(m.group(0)), body, flags=re.S)
          spans = [(m.start(), m.end()) for m in re.finditer(r'<li\b.*?</li>', masked, flags=re.S)]

          titles = [
              'From state heroes to social pariahs? Civilian hiring and voluntary service in Russia’s war in Ukraine',
              'The association between job loss and alcohol and tobacco use',
              'Cluster trials inference with CARE',
              'Under–25s show the clearest post–2021 rebound in mental health: HILDA 2001–2024',
              'Are people who use methamphetamine at increased risk of physical violence? Results from a nationally representative sample',
              'How Accurate Is Inpatient Blood Pressure Measurement?',
              'Further findings on the intergenerational transmission of alcohol consumption',
              'Dual-edged benefits of drug policing: a quarter century’s lesson from a heroin drought',
              'Risky alcohol use and violence against women: cause or consequence?',
              'A closer look at Doleac and Mukherjee (2022) and the effects of naloxone access laws on opioid ER admissions',
          ]

          desired = [
              'From state heroes to social pariahs? Civilian hiring and voluntary service in Russia’s war in Ukraine',
              'Cluster trials inference with CARE',
              'Under–25s show the clearest post–2021 rebound in mental health: HILDA 2001–2024',
              'How Accurate Is Inpatient Blood Pressure Measurement?',
              'Are people who use methamphetamine at increased risk of physical violence? Results from a nationally representative sample',
              'Dual-edged benefits of drug policing: a quarter century’s lesson from a heroin drought',
              'The association between job loss and alcohol and tobacco use',
              'Further findings on the intergenerational transmission of alcohol consumption',
              'A closer look at Doleac and Mukherjee (2022) and the effects of naloxone access laws on opioid ER admissions',
              'Risky alcohol use and violence against women: cause or consequence?',
          ]

          block_by_title = {}
          target_spans = []
          current = []
          for a, b in spans:
              block = body[a:b]
              hits = [t for t in titles if t in block]
              if len(hits) > 1:
                  raise SystemExit(f'Multiple target titles in one publication block: {hits}')
              if hits:
                  t = hits[0]
                  if t in block_by_title:
                      raise SystemExit(f'Duplicate active publication target: {t}')
                  block_by_title[t] = block
                  target_spans.append((a, b))
                  current.append(t)

          missing = [t for t in titles if t not in block_by_title]
          if missing:
              raise SystemExit(f'Missing active publication targets: {missing}')
          if len(target_spans) != len(titles):
              raise SystemExit(f'Expected {len(titles)} target blocks, found {len(target_spans)}')
          if current == desired:
              raise SystemExit(0)

          pieces = []
          last = 0
          for (a, b), title in zip(target_spans, desired):
              pieces.append(body[last:a])
              pieces.append(block_by_title[title])
              last = b
          pieces.append(body[last:])
          new_body = ''.join(pieces)

          # Verify the visible active order after reconstruction.
          new_masked = re.sub(r'<!--.*?-->', lambda m: ' ' * len(m.group(0)), new_body, flags=re.S)
          new_spans = [(m.start(), m.end()) for m in re.finditer(r'<li\b.*?</li>', new_masked, flags=re.S)]
          check = []
          for a, b in new_spans:
              block = new_body[a:b]
              hits = [t for t in titles if t in block]
              if hits:
                  check.append(hits[0])
          if check != desired:
              raise SystemExit(f'Post-reorder validation failed: {check}')

          s = s[:body_start] + new_body + s[body_end:]
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reorder recent publications by topic within year"
          git push
