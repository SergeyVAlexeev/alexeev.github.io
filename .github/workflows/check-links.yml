name: One-shot impact refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch impact section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          before, rest = s.split('<section id="impact">', 1)
          _, after = rest.split('<section id="grants">', 1)
          replacements = [
              ('https://doi.org/10.1016/j.ijnurstu.2024.104690', 'pub-encore'),
              ('https://doi.org/10.1016/j.regsciurbeco.2022.103856', 'pub-msir'),
              ('https://doi.org/10.1016/j.jebo.2022.06.015', 'pub-fines'),
              ('https://doi.org/10.1111/dar.13426', 'pub-attitudes'),
          ]
          for href, ident in replacements:
              old = '    <li>\n      <a class="pub-title" href="' + href + '"'
              new = '    <li id="' + ident + '">\n      <a class="pub-title" href="' + href + '"'
              if before.count(old) != 1:
                  raise SystemExit(f"Expected one active publication card for {href}, found {before.count(old)}")
              before = before.replace(old, new, 1)
          impact = base64.b64decode("").decode("utf-8")
          out = before + impact + "\n\n\n<section id=\"grants\">" + after
          for ident in ('pub-encore', 'pub-msir', 'pub-fines', 'pub-attitudes'):
              if out.count('id="' + ident + '"') != 1:
                  raise SystemExit(f"ID validation failed for {ident}")
          if out.count('<section id="impact">') != 1 or 'ACCELERATE trial' not in out:
              raise SystemExit("Impact validation failed")
          p.write_text(out, encoding="utf-8")
          Path(".github/workflows/check-links.yml").write_text(base64.b64decode("").decode("utf-8"), encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/check-links.yml
          git diff --cached --quiet && exit 0
          git commit -m "Strengthen selected impact evidence"
          git push
