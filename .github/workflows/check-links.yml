name: One-shot teaching refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-links.yml"

permissions:
  contents: write

jobs:
  patch-teaching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh teaching section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          if s.count('<section id="teaching">') != 1 or s.count('<section id="collaboration">') != 1:
              raise SystemExit("Teaching/collaboration section markers not unique")
          before, rest = s.split('<section id="teaching">', 1)
          _, after = rest.split('<section id="collaboration">', 1)
          teaching = base64.b64decode("").decode("utf-8")
          out = before + teaching + "\n\n\n<section id=\"collaboration\">" + after
          if "Predictive Analytics" in out or "Data Mining and Data Analysis" in out or "Time Series Econometrics" in out:
              raise SystemExit("Private-tutoring entries unexpectedly remain in active teaching section")
          if "York University (2013–2014)" not in out or "GSOM, St Petersburg State University" not in out:
              raise SystemExit("Teaching validation failed")
          p.write_text(out, encoding="utf-8")
          Path(".github/workflows/check-links.yml").write_text(base64.b64decode("")).decode("utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/check-links.yml
          git diff --cached --check
          git commit -m "Clarify teaching record"
          git push

# armed