name: One-shot publications reorder

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reorder-publications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Other Writing after Work in Progress
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '<section id="publications">' not in s or '<section id="impact">' not in s:
              raise SystemExit('Publication/impact section marker missing')
          prefix, rest = s.split('<section id="publications">', 1)
          pubs, suffix = rest.split('<section id="impact">', 1)
          forthcoming = '<summary>Forthcoming &amp; Under Review</summary>'
          wip_summary = '<summary>Work in Progress</summary>'
          other_summary = '<summary>Other Writing</summary>'
          if pubs.count(forthcoming) != 1 or pubs.count(wip_summary) != 1 or pubs.count(other_summary) != 1:
              raise SystemExit('Active publication folds are not unique')
          if pubs.index(forthcoming) < pubs.index(wip_summary) < pubs.index(other_summary):
              raise SystemExit(0)
          other_marker = '<details class="pub-fold">\n  <summary>Other Writing</summary>'
          wip_marker = '<details class="pub-fold">\n  <summary>Work in Progress</summary>'
          o0 = pubs.index(other_marker)
          o1 = pubs.index('</details>', o0) + len('</details>')
          other = pubs[o0:o1]
          pubs = pubs[:o0] + pubs[o1:]
          w0 = pubs.index(wip_marker)
          w1 = pubs.index('</details>', w0) + len('</details>')
          pubs = pubs[:w1] + '\n\n\n' + other + pubs[w1:]
          if not (pubs.index(forthcoming) < pubs.index(wip_summary) < pubs.index(other_summary)):
              raise SystemExit('Publication fold order validation failed')
          out = prefix + '<section id="publications">' + pubs + '<section id="impact">' + suffix
          p.write_text(out, encoding='utf-8')
          PY
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Move Other Writing after Work in Progress"
          git push
