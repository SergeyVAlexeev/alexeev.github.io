name: One-shot Riddle media link update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-riddle-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Riddle media link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '    · <a href="https://theconversation.com/russias-volunteer-soldiers-may-face-tougher-job-prospects-after-returning-from-ukraine-study-289045" target="_blank" rel="noopener">The Conversation</a>\n'
          addition = '    · <a href="https://ridl.io/the-kremlin-s-veteran-hero-cult-stops-at-the-workplace-door/" target="_blank" rel="noopener">Riddle</a>\n'

          if addition in s:
              raise SystemExit(0)
          if s.count(old) != 1:
              raise SystemExit(f'Expected one matching The Conversation line, found {s.count(old)}')

          p.write_text(s.replace(old, old + addition, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Riddle coverage to veterans paper"
          git push
