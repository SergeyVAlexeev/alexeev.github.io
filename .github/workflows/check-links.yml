name: One-shot EUROPP label normalization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize-europp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize EUROPP label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="https://blogs.lse.ac.uk/europpblog/2026/08/25/russias-employers-ukraine-veterans-jobs-putin/" target="_blank" rel="noopener">LSE European Politics and Policy</a>'
          new = '<a href="https://blogs.lse.ac.uk/europpblog/2026/08/25/russias-employers-ukraine-veterans-jobs-putin/" target="_blank" rel="noopener">EUROPP</a>'
          if new in s:
              raise SystemExit(0)
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one target anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Standardize EUROPP media label"
          git push
