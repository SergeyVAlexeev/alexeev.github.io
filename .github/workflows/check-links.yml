name: One-shot USyd profile URL correction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-usyd-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use directory-linked USyd profile URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://ctc.usyd.edu.au/about-us/our-people/academics-research-fellows/dr-sergey-alexeev?query=2024'
          new = 'https://ctc.usyd.edu.au/about-us/our-people/academics-research-fellows/dr-sergey-alexeev/'
          if new in s:
              raise SystemExit(0)
          if s.count(old) != 1:
              raise SystemExit(f'Expected one USyd profile URL, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use direct USyd profile URL"
          git push
